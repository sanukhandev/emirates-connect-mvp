name: Validate parent
on: [pull_request, push]
permissions: { contents: read }
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Verify submodules
        run: git submodule status --recursive
      - name: Ensure required parent docs exist
        run: |
          test -f AGENTS.md
          test -f docs/api/openapi.yaml
          test -f docs/architecture/ARCHITECTURE.md
          test -f docs/design/DESIGN-SYSTEM.md
          test -f docs/design/UI-PRINCIPLES.md
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql
          coverage: none
      - name: Validate backend
        working-directory: backend
        run: |
          composer install --no-interaction --prefer-dist
          php artisan test
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm test -- --watch=false
      - name: Validate mobile when scaffolded
        if: hashFiles('mobile/pubspec.yaml') != ''
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Test mobile when scaffolded
        if: hashFiles('mobile/pubspec.yaml') != ''
        working-directory: mobile
        run: |
          flutter pub get
          flutter analyze
          flutter test
