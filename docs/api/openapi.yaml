openapi: 3.1.0
info:
  title: Emirates Connect API
  version: 0.1.0
servers:
  - url: https://api.example.com/api/v1
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status, service]
                    properties:
                      status: { type: string, example: ok }
                      service: { type: string, example: emirates-connect-api }
  /auth/register:
    post:
      summary: Register user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountCredentials' }
      responses:
        '201':
          description: Registered and authenticated
          content: { application/json: { schema: { $ref: '#/components/schemas/SpaAuthResponse' } } }
        '422': { description: Validation error }
  /auth/login:
    post:
      summary: Authenticate user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated
          content: { application/json: { schema: { $ref: '#/components/schemas/SpaAuthResponse' } } }
        '401': { description: Invalid credentials }
        '403': { description: Account suspended or disabled }
        '422': { description: Validation error }
        '429': { description: Too many attempts }
  /auth/mobile/token:
    post:
      summary: Issue a Sanctum personal access token for Flutter
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MobileTokenRequest' }
      responses:
        '200':
          description: Device token issued
          content: { application/json: { schema: { $ref: '#/components/schemas/MobileAuthResponse' } } }
        '401': { description: Invalid credentials }
        '403': { description: Account suspended or disabled }
        '422': { description: Validation error }
  /auth/logout:
    post:
      summary: Revoke the current bearer token
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses: { '204': { description: Token revoked }, '401': { description: Unauthenticated } }
  /auth/forgot-password:
    post:
      summary: Request password reset instructions
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EmailRequest' } } }
      responses:
        '200': { description: Enumeration-safe response }
        '422': { description: Validation error }
        '429': { description: Too many attempts }
  /auth/reset-password:
    post:
      summary: Reset a password
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ResetPasswordRequest' } } }
      responses: { '200': { description: Password reset }, '422': { description: Invalid token or validation error } }
  /auth/email/verification-notification:
    post:
      summary: Resend email verification notification
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses: { '202': { description: Notification queued }, '401': { description: Unauthenticated }, '429': { description: Too many requests } }
  /auth/verify-email/{id}/{hash}:
    get:
      summary: Verify an email using a signed URL
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: hash, in: path, required: true, schema: { type: string } }
      responses: { '200': { description: Email verified }, '403': { description: Invalid signature } }
  /me:
    get:
      summary: Current user/profile
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses: { '200': { description: Current account }, '401': { description: Unauthenticated }, '403': { description: Account inactive } }
    patch:
      summary: Update the current account name or email
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 255 }
                email: { type: string, format: email, maxLength: 255 }
      responses: { '200': { description: Account updated }, '401': { description: Unauthenticated }, '422': { description: Validation error } }
  /me/profile:
    get:
      summary: Read the current professional profile
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses: { '200': { description: Profile resource }, '401': { description: Unauthenticated }, '403': { description: Account inactive } }
    patch:
      summary: Update the current professional profile
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProfileUpdate' } } }
      responses: { '200': { description: Profile resource }, '401': { description: Unauthenticated }, '422': { description: Validation error } }
  /me/onboarding/complete:
    post:
      summary: Complete professional profile onboarding
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OnboardingRequest' } } }
      responses: { '200': { description: Completed profile resource }, '401': { description: Unauthenticated }, '422': { description: Missing or invalid required fields } }
  /me/profile/avatar:
    post:
      summary: Upload or replace the current avatar
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody: { required: true, content: { multipart/form-data: { schema: { $ref: '#/components/schemas/AvatarUpload' } } } }
      responses: { '200': { description: Profile resource }, '401': { description: Unauthenticated }, '422': { description: Invalid image } }
    delete:
      summary: Delete the current avatar
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses: { '204': { description: Deleted }, '401': { description: Unauthenticated } }
  /me/profile/cover-image:
    post:
      summary: Upload or replace the current cover image
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody: { required: true, content: { multipart/form-data: { schema: { $ref: '#/components/schemas/CoverUpload' } } } }
      responses: { '200': { description: Profile resource }, '401': { description: Unauthenticated }, '422': { description: Invalid image } }
    delete:
      summary: Delete the current cover image
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses: { '204': { description: Deleted }, '401': { description: Unauthenticated } }
  /users/{user}:
    get:
      summary: Read a public user profile
      parameters: [{ name: user, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses: { '200': { description: Public profile }, '404': { description: User not found or unavailable } }
  /users/{user}/follow:
    put:
      summary: Follow a public user
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ name: user, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses: { '200': { description: Updated follow state }, '401': { description: Unauthenticated }, '404': { description: User unavailable }, '422': { description: Self-follow rejected } }
    delete:
      summary: Unfollow a public user
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ name: user, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses: { '204': { description: Unfollowed or already absent }, '401': { description: Unauthenticated }, '404': { description: User unavailable } }
  /users/{user}/followers:
    get:
      summary: List visible followers of a user
      parameters: [{ name: user, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses: { '200': { description: Paginated follower users }, '404': { description: User unavailable } }
  /users/{user}/following:
    get:
      summary: List visible targets followed by a user
      parameters: [{ name: user, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses: { '200': { description: Paginated heterogeneous user and business targets }, '404': { description: User unavailable } }
  /meta/industries:
    get:
      summary: List supported profile industries
      responses: { '200': { description: Industry options } }
  /meta/emirates:
    get:
      summary: List supported UAE emirates
      responses: { '200': { description: Emirate options } }
  /verification/user:
    get:
      summary: Get the current user's verification status
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses: { '200': { description: Management status }, '401': { description: Unauthenticated } }
    post:
      summary: Submit the current user for verification
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody: { required: true, content: { multipart/form-data: { schema: { $ref: '#/components/schemas/UserVerificationSubmission' } } } }
      responses: { '201': { description: Pending verification request }, '409': { description: Already pending or approved }, '422': { description: Validation error } }
  /verification/business/{business}:
    get:
      summary: Get verification status for an authorized business manager
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ name: business, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Management status }, '403': { description: Owner/admin required }, '404': { description: Business unavailable } }
    post:
      summary: Submit an active business for verification
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ name: business, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { multipart/form-data: { schema: { $ref: '#/components/schemas/BusinessVerificationSubmission' } } } }
      responses: { '201': { description: Pending verification request }, '403': { description: Owner/admin required }, '409': { description: Already pending or approved }, '422': { description: Validation error } }
  /admin/verifications:
    get:
      summary: List verification requests for system administrators
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [not_submitted, pending, approved, rejected] } }
        - { name: subject_type, in: query, schema: { type: string, enum: [user, business] } }
      responses: { '200': { description: Paginated verification requests }, '403': { description: System administrator required } }
  /admin/verifications/audit:
    get:
      summary: List verification audit entries for system administrators
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { name: action, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses: { '200': { description: Paginated verification audit }, '403': { description: System administrator required } }
  /admin/verifications/{verification}:
    get:
      summary: Get verification detail and audit history
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ name: verification, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses: { '200': { description: Verification detail }, '403': { description: System administrator required }, '404': { description: Not found } }
  /admin/verifications/{verification}/approve:
    post:
      summary: Approve a pending verification request
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ name: verification, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses: { '200': { description: Approved }, '403': { description: System administrator required }, '409': { description: Invalid transition } }
  /admin/verifications/{verification}/reject:
    post:
      summary: Reject a pending verification request
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ name: verification, in: path, required: true, schema: { type: integer, format: int64 } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RejectVerificationRequest' } } } }
      responses: { '200': { description: Rejected }, '403': { description: System administrator required }, '409': { description: Invalid transition }, '422': { description: Rejection reason required } }
  /admin/verifications/{verification}/documents/{document}:
    get:
      summary: Get a short-lived signed URL for a private verification document
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { name: verification, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: document, in: path, required: true, schema: { type: integer, format: int64 } }
      responses: { '200': { description: Temporary signed URL, content: { application/json: { schema: { $ref: '#/components/schemas/TemporaryDocumentAccess' } } } }, '403': { description: System administrator required }, '404': { description: Document not found or IDOR blocked } }
  /posts:
    post:
      summary: Create a text or image post as the current user or an authorized business
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/CreatePostRequest' } }
          multipart/form-data: { schema: { $ref: '#/components/schemas/CreatePostMultipartRequest' } }
      responses: { '201': { description: Created }, '401': { description: Unauthenticated }, '403': { description: Business publishing forbidden }, '422': { description: Validation error } }
  /reels:
    get:
      summary: List published reels chronologically
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses: { '200': { description: Cursor-paginated public reels } }
    post:
      summary: Create a reel upload session
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateReelRequest' } } } }
      responses: { '201': { description: Reel in uploading state }, '401': { description: Unauthenticated }, '403': { description: Business authorization denied }, '422': { description: Validation error }, '429': { description: Too many uploads } }
  /reels/{reel}:
    parameters: [{ name: reel, in: path, required: true, schema: { type: integer, format: int64 } }]
    get:
      summary: Read a published reel or an authorized creator reel
      responses: { '200': { description: Reel resource }, '404': { description: Reel unavailable } }
    patch:
      summary: Update a reel caption
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateReelRequest' } } } }
      responses: { '200': { description: Updated reel }, '403': { description: Unauthorized creator or manager }, '422': { description: Validation error } }
    delete:
      summary: Soft-delete a reel and clean its media assets
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses: { '204': { description: Deleted }, '403': { description: Unauthorized creator or manager } }
  /reels/{reel}/video:
    post:
      summary: Upload and process one private MP4 source video
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ name: reel, in: path, required: true, schema: { type: integer, format: int64 } }]
      requestBody: { required: true, content: { multipart/form-data: { schema: { $ref: '#/components/schemas/ReelVideoUpload' } } } }
      responses: { '200': { description: Published or failed processing result }, '403': { description: Unauthorized creator or manager }, '422': { description: Invalid video }, '429': { description: Too many uploads } }
  /me/reels:
    get:
      summary: List the current user's reels
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses: { '200': { description: Cursor-paginated creator reels } }
  /users/{user}/reels:
    get:
      summary: List published reels by a visible user
      parameters: [{ name: user, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses: { '200': { description: Cursor-paginated published reels }, '404': { description: User unavailable } }
  /businesses/{business}/reels:
    get:
      summary: List published reels by an active business
      parameters: [{ name: business, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Cursor-paginated published reels }, '404': { description: Business unavailable } }
  /posts/{post}:
    parameters: [{ name: post, in: path, required: true, schema: { type: integer, format: int64 } }]
    get:
      summary: Read a published post or an authorized draft
      responses: { '200': { description: Post }, '404': { description: Post not found or not visible } }
    patch:
      summary: Update an owned or authorized business post
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdatePostRequest' } } } }
      responses: { '200': { description: Updated post }, '401': { description: Unauthenticated }, '403': { description: Forbidden }, '422': { description: Validation error } }
    delete:
      summary: Soft-delete an owned or authorized business post
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses: { '204': { description: Deleted }, '401': { description: Unauthenticated }, '403': { description: Forbidden } }
  /posts/{post}/media:
    parameters: [{ name: post, in: path, required: true, schema: { type: integer, format: int64 } }]
    post:
      summary: Add one image to an owned or authorized business post
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody: { required: true, content: { multipart/form-data: { schema: { $ref: '#/components/schemas/AddPostMediaRequest' } } } }
      responses: { '201': { description: Updated post }, '401': { description: Unauthenticated }, '403': { description: Forbidden }, '422': { description: Invalid image or media limit } }
  /posts/{post}/media/{media}:
    parameters:
      - { name: post, in: path, required: true, schema: { type: integer, format: int64 } }
      - { name: media, in: path, required: true, schema: { type: integer, format: int64 }, description: Media identifier scoped to the post }
    delete:
      summary: Remove image media from an owned or authorized business post
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses: { '200': { description: Updated post }, '401': { description: Unauthenticated }, '403': { description: Forbidden }, '404': { description: Media not in post } }
  /feed:
    get:
      summary: List the authenticated global chronological feed
      description: Phase 1 aggregates published user and active-business posts. It is chronological discovery, not follow-based or ranked.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { name: cursor, in: query, required: false, schema: { type: string }, description: Cursor returned in the previous response }
        - { name: per_page, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses: { '200': { description: Cursor-paginated posts, content: { application/json: { schema: { $ref: '#/components/schemas/CursorPaginatedPosts' } } } }, '401': { description: Unauthenticated }, '403': { description: Account is not active }, '422': { description: Invalid cursor or page size } }
  /me/posts:
    get:
      summary: List the current user's published and draft posts
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses: { '200': { description: Paginated posts }, '401': { description: Unauthenticated } }
  /users/{user}/posts:
    get:
      summary: List published posts authored by a user
      parameters: [{ name: user, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses: { '200': { description: Paginated published posts }, '404': { description: User unavailable } }
  /posts/{post}/comments:
    get:
      summary: List visible top-level comments and one-level replies
      parameters: [{ name: post, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses: { '200': { description: Paginated comments, content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedComments' } } } }, '404': { description: Post unavailable } }
    post:
      summary: Add a top-level user or business comment
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ name: post, in: path, required: true, schema: { type: integer, format: int64 } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateCommentRequest' } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/CommentResponse' } } } }, '401': { description: Unauthenticated }, '403': { description: Author not permitted }, '404': { description: Post unavailable }, '422': { description: Validation error } }
  /comments/{comment}/replies:
    post:
      summary: Add a one-level reply to a visible top-level comment
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ name: comment, in: path, required: true, schema: { type: integer, format: int64 } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateCommentRequest' } } } }
      responses: { '201': { description: Created }, '403': { description: Reply not permitted }, '422': { description: Reply depth or validation error } }
  /comments/{comment}:
    parameters: [{ name: comment, in: path, required: true, schema: { type: integer, format: int64 } }]
    patch:
      summary: Edit a comment body
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateCommentRequest' } } } }
      responses: { '200': { description: Updated comment }, '403': { description: Not authorized }, '404': { description: Comment unavailable }, '422': { description: Validation error } }
    delete:
      summary: Soft-delete a comment or reply
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses: { '204': { description: Deleted }, '403': { description: Not authorized }, '404': { description: Comment unavailable } }
  /posts/{post}/reaction:
    parameters: [{ name: post, in: path, required: true, schema: { type: integer, format: int64 } }]
    put:
      summary: Set or switch the current human user's reaction on a visible post
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SetReactionRequest' } } } }
      responses: { '200': { description: Updated post with reaction summary }, '401': { description: Unauthenticated }, '403': { description: Account is not active }, '404': { description: Post unavailable }, '422': { description: Invalid reaction type } }
    delete:
      summary: Remove the current human user's reaction from a visible post
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses: { '204': { description: Removed or already absent }, '401': { description: Unauthenticated }, '404': { description: Post unavailable } }
  /comments/{comment}/reaction:
    parameters: [{ name: comment, in: path, required: true, schema: { type: integer, format: int64 } }]
    put:
      summary: Set or switch the current human user's reaction on a visible comment or reply
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SetReactionRequest' } } } }
      responses: { '200': { description: Updated comment with reaction summary }, '401': { description: Unauthenticated }, '403': { description: Account is not active }, '404': { description: Comment unavailable }, '422': { description: Invalid reaction type } }
    delete:
      summary: Remove the current human user's reaction from a visible comment or reply
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses: { '204': { description: Removed or already absent }, '401': { description: Unauthenticated }, '404': { description: Comment unavailable } }
  /businesses:
    post:
      summary: Create business page
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateBusinessRequest' } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/BusinessResponse' } } } }, '401': { description: Unauthenticated }, '422': { description: Validation error } }
  /businesses/{business}:
    parameters: [{ name: business, in: path, required: true, schema: { type: string }, description: Stable business slug }]
    get:
      summary: Read an active public business page
      responses: { '200': { description: Public business }, '404': { description: Business not found or unavailable } }
    patch:
      summary: Update a business page
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateBusinessRequest' } } }
      responses: { '200': { description: Updated business }, '401': { description: Unauthenticated }, '403': { description: Owner or admin required }, '422': { description: Validation error } }
    delete:
      summary: Deactivate a business page
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses: { '204': { description: Deactivated }, '401': { description: Unauthenticated }, '403': { description: Owner required } }
  /businesses/{business}/follow:
    put:
      summary: Follow an active business
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ name: business, in: path, required: true, schema: { type: string }, description: Stable business slug }]
      responses: { '200': { description: Updated follow state }, '401': { description: Unauthenticated }, '404': { description: Business unavailable } }
    delete:
      summary: Unfollow an active business
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ name: business, in: path, required: true, schema: { type: string }, description: Stable business slug }]
      responses: { '204': { description: Unfollowed or already absent }, '401': { description: Unauthenticated }, '404': { description: Business unavailable } }
  /businesses/{business}/followers:
    get:
      summary: List visible followers of an active business
      parameters: [{ name: business, in: path, required: true, schema: { type: string }, description: Stable business slug }]
      responses: { '200': { description: Paginated follower users }, '404': { description: Business unavailable } }
  /me/businesses:
    get:
      summary: List businesses operated by the current user
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses: { '200': { description: Paginated businesses }, '401': { description: Unauthenticated } }
  /businesses/{business}/members:
    parameters: [{ name: business, in: path, required: true, schema: { type: string }, description: Stable business slug }]
    get:
      summary: List business members
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses: { '200': { description: Paginated members }, '401': { description: Unauthenticated }, '403': { description: Owner or admin required } }
    post:
      summary: Add an existing active user to a business
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
