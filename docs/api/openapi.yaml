openapi: 3.1.0
info:
  title: Emirates Connect API
  version: 0.1.0
servers:
  - url: https://api.example.com/api/v1
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status, service]
                    properties:
                      status: { type: string, example: ok }
                      service: { type: string, example: emirates-connect-api }
  /auth/register:
    post:
      summary: Register user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountCredentials' }
      responses:
        '201':
          description: Registered and authenticated
          content: { application/json: { schema: { $ref: '#/components/schemas/SpaAuthResponse' } } }
        '422': { description: Validation error }
  /auth/login:
    post:
      summary: Authenticate user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated
          content: { application/json: { schema: { $ref: '#/components/schemas/SpaAuthResponse' } } }
        '401': { description: Invalid credentials }
        '403': { description: Account suspended or disabled }
        '422': { description: Validation error }
        '429': { description: Too many attempts }
  /auth/mobile/token:
    post:
      summary: Issue a Sanctum personal access token for Flutter
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MobileTokenRequest' }
      responses:
        '200':
          description: Device token issued
          content: { application/json: { schema: { $ref: '#/components/schemas/MobileAuthResponse' } } }
        '401': { description: Invalid credentials }
        '403': { description: Account suspended or disabled }
        '422': { description: Validation error }
  /auth/logout:
    post:
      summary: Revoke the current bearer token
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses: { '204': { description: Token revoked }, '401': { description: Unauthenticated } }
  /auth/forgot-password:
    post:
      summary: Request password reset instructions
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EmailRequest' } } }
      responses:
        '200': { description: Enumeration-safe response }
        '422': { description: Validation error }
        '429': { description: Too many attempts }
  /auth/reset-password:
    post:
      summary: Reset a password
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ResetPasswordRequest' } } }
      responses: { '200': { description: Password reset }, '422': { description: Invalid token or validation error } }
  /auth/email/verification-notification:
    post:
      summary: Resend email verification notification
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses: { '202': { description: Notification queued }, '401': { description: Unauthenticated }, '429': { description: Too many requests } }
  /auth/verify-email/{id}/{hash}:
    get:
      summary: Verify an email using a signed URL
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: hash, in: path, required: true, schema: { type: string } }
      responses: { '200': { description: Email verified }, '403': { description: Invalid signature } }
  /me:
    get:
      summary: Current user/profile
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses: { '200': { description: Current account }, '401': { description: Unauthenticated }, '403': { description: Account inactive } }
    patch:
      summary: Update the current account name or email
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 255 }
                email: { type: string, format: email, maxLength: 255 }
      responses: { '200': { description: Account updated }, '401': { description: Unauthenticated }, '422': { description: Validation error } }
  /me/profile:
    get:
      summary: Read the current professional profile
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses: { '200': { description: Profile resource }, '401': { description: Unauthenticated }, '403': { description: Account inactive } }
    patch:
      summary: Update the current professional profile
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProfileUpdate' } } }
      responses: { '200': { description: Profile resource }, '401': { description: Unauthenticated }, '422': { description: Validation error } }
  /me/onboarding/complete:
    post:
      summary: Complete professional profile onboarding
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OnboardingRequest' } } }
      responses: { '200': { description: Completed profile resource }, '401': { description: Unauthenticated }, '422': { description: Missing or invalid required fields } }
  /me/profile/avatar:
    post:
      summary: Upload or replace the current avatar
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody: { required: true, content: { multipart/form-data: { schema: { $ref: '#/components/schemas/AvatarUpload' } } } }
      responses: { '200': { description: Profile resource }, '401': { description: Unauthenticated }, '422': { description: Invalid image } }
    delete:
      summary: Delete the current avatar
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses: { '204': { description: Deleted }, '401': { description: Unauthenticated } }
  /me/profile/cover-image:
    post:
      summary: Upload or replace the current cover image
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody: { required: true, content: { multipart/form-data: { schema: { $ref: '#/components/schemas/CoverUpload' } } } }
      responses: { '200': { description: Profile resource }, '401': { description: Unauthenticated }, '422': { description: Invalid image } }
    delete:
      summary: Delete the current cover image
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses: { '204': { description: Deleted }, '401': { description: Unauthenticated } }
  /users/{user}:
    get:
      summary: Read a public user profile
      parameters: [{ name: user, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses: { '200': { description: Public profile }, '404': { description: User not found or unavailable } }
  /meta/industries:
    get:
      summary: List supported profile industries
      responses: { '200': { description: Industry options } }
  /meta/emirates:
    get:
      summary: List supported UAE emirates
      responses: { '200': { description: Emirate options } }
  /verification-requests:
    post:
      summary: Submit verification request
      responses: { '202': { description: Submitted } }
  /posts:
    post:
      summary: Create a text or image post as the current user or an authorized business
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/CreatePostRequest' } }
          multipart/form-data: { schema: { $ref: '#/components/schemas/CreatePostMultipartRequest' } }
      responses: { '201': { description: Created }, '401': { description: Unauthenticated }, '403': { description: Business publishing forbidden }, '422': { description: Validation error } }
  /posts/{post}:
    parameters: [{ name: post, in: path, required: true, schema: { type: integer, format: int64 } }]
    get:
      summary: Read a published post or an authorized draft
      responses: { '200': { description: Post }, '404': { description: Post not found or not visible } }
    patch:
      summary: Update an owned or authorized business post
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdatePostRequest' } } } }
      responses: { '200': { description: Updated post }, '401': { description: Unauthenticated }, '403': { description: Forbidden }, '422': { description: Validation error } }
    delete:
      summary: Soft-delete an owned or authorized business post
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses: { '204': { description: Deleted }, '401': { description: Unauthenticated }, '403': { description: Forbidden } }
  /posts/{post}/media:
    parameters: [{ name: post, in: path, required: true, schema: { type: integer, format: int64 } }]
    post:
      summary: Add one image to an owned or authorized business post
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody: { required: true, content: { multipart/form-data: { schema: { $ref: '#/components/schemas/AddPostMediaRequest' } } } }
      responses: { '201': { description: Updated post }, '401': { description: Unauthenticated }, '403': { description: Forbidden }, '422': { description: Invalid image or media limit } }
  /posts/{post}/media/{media}:
    parameters:
      - { name: post, in: path, required: true, schema: { type: integer, format: int64 } }
      - { name: media, in: path, required: true, schema: { type: integer, format: int64 }, description: Media identifier scoped to the post }
    delete:
      summary: Remove image media from an owned or authorized business post
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses: { '200': { description: Updated post }, '401': { description: Unauthenticated }, '403': { description: Forbidden }, '404': { description: Media not in post } }
  /feed:
    get:
      summary: List the authenticated global chronological feed
      description: Phase 1 aggregates published user and active-business posts. It is chronological discovery, not follow-based or ranked.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { name: cursor, in: query, required: false, schema: { type: string }, description: Cursor returned in the previous response }
        - { name: per_page, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses: { '200': { description: Cursor-paginated posts, content: { application/json: { schema: { $ref: '#/components/schemas/CursorPaginatedPosts' } } } }, '401': { description: Unauthenticated }, '403': { description: Account is not active }, '422': { description: Invalid cursor or page size } }
  /me/posts:
    get:
      summary: List the current user's published and draft posts
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses: { '200': { description: Paginated posts }, '401': { description: Unauthenticated } }
  /users/{user}/posts:
    get:
      summary: List published posts authored by a user
      parameters: [{ name: user, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses: { '200': { description: Paginated published posts }, '404': { description: User unavailable } }
  /posts/{post}/comments:
    post:
      summary: Add comment or reply using optional parent_comment_id
      parameters: [{ name: post, in: path, required: true, schema: { type: string } }]
      responses: { '201': { description: Created } }
  /businesses:
    post:
      summary: Create business page
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateBusinessRequest' } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/BusinessResponse' } } } }, '401': { description: Unauthenticated }, '422': { description: Validation error } }
  /businesses/{business}:
    parameters: [{ name: business, in: path, required: true, schema: { type: string }, description: Stable business slug }]
    get:
      summary: Read an active public business page
      responses: { '200': { description: Public business }, '404': { description: Business not found or unavailable } }
    patch:
      summary: Update a business page
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateBusinessRequest' } } }
      responses: { '200': { description: Updated business }, '401': { description: Unauthenticated }, '403': { description: Owner or admin required }, '422': { description: Validation error } }
    delete:
      summary: Deactivate a business page
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses: { '204': { description: Deactivated }, '401': { description: Unauthenticated }, '403': { description: Owner required } }
  /me/businesses:
    get:
      summary: List businesses operated by the current user
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses: { '200': { description: Paginated businesses }, '401': { description: Unauthenticated } }
  /businesses/{business}/members:
    parameters: [{ name: business, in: path, required: true, schema: { type: string }, description: Stable business slug }]
    get:
      summary: List business members
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses: { '200': { description: Paginated members }, '401': { description: Unauthenticated }, '403': { description: Owner or admin required } }
    post:
      summary: Add an existing active user to a business
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AddBusinessMemberRequest' } } }
      responses: { '201': { description: Member added }, '401': { description: Unauthenticated }, '403': { description: Role not permitted }, '422': { description: Validation error or duplicate membership } }
  /businesses/{business}/members/{member}:
    parameters:
      - { name: business, in: path, required: true, schema: { type: string }, description: Stable business slug }
      - { name: member, in: path, required: true, schema: { type: integer, format: int64 }, description: Membership identifier scoped to the business }
    patch:
      summary: Change a non-owner member role
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateBusinessMemberRequest' } } }
      responses: { '200': { description: Updated member }, '401': { description: Unauthenticated }, '403': { description: Role not permitted }, '404': { description: Membership not in business } }
    delete:
      summary: Remove a non-owner business member
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses: { '204': { description: Removed }, '401': { description: Unauthenticated }, '403': { description: Role not permitted }, '404': { description: Membership not in business } }
  /businesses/{business}/logo:
    parameters: [{ name: business, in: path, required: true, schema: { type: string }, description: Stable business slug }]
    post:
      summary: Upload or replace a business logo
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody: { required: true, content: { multipart/form-data: { schema: { $ref: '#/components/schemas/BusinessLogoUpload' } } } }
      responses: { '200': { description: Updated business }, '401': { description: Unauthenticated }, '403': { description: Owner or admin required }, '422': { description: Invalid image } }
    delete:
      summary: Delete a business logo
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses: { '204': { description: Deleted }, '401': { description: Unauthenticated }, '403': { description: Owner or admin required } }
  /businesses/{business}/cover-image:
    parameters: [{ name: business, in: path, required: true, schema: { type: string }, description: Stable business slug }]
    post:
      summary: Upload or replace a business cover image
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody: { required: true, content: { multipart/form-data: { schema: { $ref: '#/components/schemas/BusinessCoverUpload' } } } }
      responses: { '200': { description: Updated business }, '401': { description: Unauthenticated }, '403': { description: Owner or admin required }, '422': { description: Invalid image } }
    delete:
      summary: Delete a business cover image
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses: { '204': { description: Deleted }, '401': { description: Unauthenticated }, '403': { description: Owner or admin required } }
  /businesses/{business}/posts:
    get:
      summary: List published posts authored by an active business
      parameters: [{ name: business, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Paginated published posts }, '404': { description: Business unavailable } }
  /reels:
    get:
      summary: Reels feed
      responses: { '200': { description: Cursor-paginated reels } }
    post:
      summary: Create reel metadata after media upload
      responses: { '202': { description: Accepted for processing } }
  /media/upload-intents:
    post:
      summary: Request signed media upload
      responses: { '201': { description: Upload intent created } }
  /reports:
    post:
      summary: Report content/account/business
      responses: { '201': { description: Report created } }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: emirates-connect-session
      description: Laravel session cookie after GET /sanctum/csrf-cookie and credentialed SPA login.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
  schemas:
    AccountCredentials:
      type: object
      required: [name, email, password, password_confirmation]
      properties:
        name: { type: string, maxLength: 255, example: Sanu Khan }
        email: { type: string, format: email, maxLength: 255, example: sanu@example.com }
        password: { type: string, format: password, minLength: 8 }
        password_confirmation: { type: string, format: password }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    EmailRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    ResetPasswordRequest:
      allOf:
        - $ref: '#/components/schemas/EmailRequest'
        - type: object
          required: [token, password, password_confirmation]
          properties:
            token: { type: string }
            password: { type: string, format: password, minLength: 8 }
            password_confirmation: { type: string, format: password }
    MobileTokenRequest:
      type: object
      required: [email, password, device_name]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
        device_name: { type: string, maxLength: 100, example: Sanu's iPhone }
    SpaAuthResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [user]
          properties:
            user: { $ref: '#/components/schemas/User' }
    MobileAuthResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [user, token]
          properties:
            user: { $ref: '#/components/schemas/User' }
            token: { type: string }
    User:
      type: object
      required: [id, name, email, account_status]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        email: { type: string, format: email }
        email_verified_at: { type: string, format: date-time, nullable: true }
        account_status: { type: string, enum: [pending, active, suspended, disabled] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        profile: { $ref: '#/components/schemas/Profile' }
    Profile:
      type: object
      properties:
        display_name: { type: string, nullable: true }
        headline: { type: string, maxLength: 160, nullable: true }
        bio: { type: string, maxLength: 2000, nullable: true }
        job_title: { type: string, maxLength: 120, nullable: true }
        company_name: { type: string, nullable: true }
        industry: { type: string, nullable: true }
        emirate: { type: string, nullable: true }
        website_url: { type: string, format: uri, nullable: true }
        linkedin_url: { type: string, format: uri, nullable: true }
        avatar_url: { type: string, format: uri, nullable: true }
        cover_image_url: { type: string, format: uri, nullable: true }
        onboarding_completed: { type: boolean }
    ProfileUpdate:
      allOf:
        - $ref: '#/components/schemas/Profile'
    OnboardingRequest:
      allOf:
        - $ref: '#/components/schemas/ProfileUpdate'
      required: [display_name, headline, job_title, industry, emirate]
    AvatarUpload:
      type: object
      required: [avatar]
      properties:
        avatar: { type: string, format: binary, description: JPEG, PNG or WebP up to 5 MB }
    CoverUpload:
      type: object
      required: [cover_image]
      properties:
        cover_image: { type: string, format: binary, description: JPEG, PNG or WebP up to 8 MB }
    BusinessResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Business' }
    Business:
      type: object
      required: [id, name, slug, industry, emirate, status]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, maxLength: 150 }
        slug: { type: string }
        tagline: { type: string, nullable: true, maxLength: 180 }
        description: { type: string, nullable: true, maxLength: 5000 }
        industry: { type: string }
        emirate: { type: string }
        website_url: { type: string, format: uri, nullable: true }
        email: { type: string, format: email, nullable: true }
        phone: { type: string, nullable: true, maxLength: 30 }
        logo_url: { type: string, format: uri, nullable: true }
        cover_image_url: { type: string, format: uri, nullable: true }
        status: { type: string, enum: [active, inactive, suspended] }
        current_user_role: { type: string, enum: [owner, admin, editor], nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateBusinessRequest:
      type: object
      required: [name, industry, emirate]
      properties:
        name: { type: string, maxLength: 150 }
        tagline: { type: string, maxLength: 180, nullable: true }
        description: { type: string, maxLength: 5000, nullable: true }
        industry: { type: string }
        emirate: { type: string }
        website_url: { type: string, format: uri, nullable: true }
        email: { type: string, format: email, nullable: true }
        phone: { type: string, maxLength: 30, nullable: true }
    UpdateBusinessRequest:
      type: object
      properties:
        name: { type: string, maxLength: 150 }
        tagline: { type: string, maxLength: 180, nullable: true }
        description: { type: string, maxLength: 5000, nullable: true }
        industry: { type: string }
        emirate: { type: string }
        website_url: { type: string, format: uri, nullable: true }
        email: { type: string, format: email, nullable: true }
        phone: { type: string, maxLength: 30, nullable: true }
    AddBusinessMemberRequest:
      type: object
      required: [user_id, role]
      properties:
        user_id: { type: integer, format: int64 }
        role: { type: string, enum: [admin, editor] }
    UpdateBusinessMemberRequest:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [admin, editor] }
    BusinessLogoUpload:
      type: object
      required: [logo]
      properties:
        logo: { type: string, format: binary, description: JPEG, PNG or WebP up to 5 MB }
    BusinessCoverUpload:
      type: object
      required: [cover_image]
      properties:
        cover_image: { type: string, format: binary, description: JPEG, PNG or WebP up to 8 MB }
    PostResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Post' }
    CursorPaginatedPosts:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Post' } }
        meta:
          type: object
          properties:
            per_page: { type: integer }
            next_cursor: { type: string, nullable: true }
            prev_cursor: { type: string, nullable: true }
    Post:
      type: object
      required: [id, status, author, media]
      properties:
        id: { type: integer, format: int64 }
        body: { type: string, nullable: true, maxLength: 5000 }
        status: { type: string, enum: [draft, published] }
        published_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        author: { $ref: '#/components/schemas/PostAuthor' }
        media: { type: array, maxItems: 4, items: { $ref: '#/components/schemas/PostMedia' } }
    PostAuthor:
      oneOf:
        - $ref: '#/components/schemas/UserPostAuthor'
        - $ref: '#/components/schemas/BusinessPostAuthor'
    UserPostAuthor:
      type: object
      required: [type, id, name]
      properties:
        type: { type: string, enum: [user] }
        id: { type: integer, format: int64 }
        name: { type: string }
        display_name: { type: string, nullable: true }
        headline: { type: string, nullable: true }
        avatar_url: { type: string, format: uri, nullable: true }
    BusinessPostAuthor:
      type: object
      required: [type, id, name, slug]
      properties:
        type: { type: string, enum: [business] }
        id: { type: integer, format: int64 }
        name: { type: string }
        slug: { type: string }
        logo_url: { type: string, format: uri, nullable: true }
    PostMedia:
      type: object
      required: [id, type, url, mime_type, sort_order]
      properties:
        id: { type: integer, format: int64 }
        type: { type: string, enum: [image] }
        url: { type: string, format: uri }
