      parameters: [{ name: report, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: Admin report detail }, '403': { description: System admin required }, '404': { description: Report not found } }
    patch:
      summary: Dismiss a report or apply a target-appropriate moderation action
