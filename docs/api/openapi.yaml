      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportCreate' }
      responses: { '201': { description: Report created }, '404': { description: Target unavailable }, '409': { description: Duplicate unresolved report }, '422': { description: Invalid report } }
  /me/reports:
    get:
      summary: List the authenticated user's submitted reports
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }, { name: cursor, in: query, schema: { type: string } }]
      responses: { '200': { description: Cursor-paginated reporter-scoped reports }, '401': { description: Unauthenticated } }
  /admin/reports:
    get:
      summary: List reports for system-admin moderation
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, reviewed, dismissed, actioned] } }
        - { name: target_type, in: query, schema: { type: string, enum: [user, business, post, comment, reel] } }
        - { name: reason, in: query, schema: { type: string, enum: [spam, harassment, hate_or_abuse, misinformation, impersonation, inappropriate_content, fraud_or_scam, privacy_violation, other] } }
