        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportModeration' }
      responses: { '200': { description: Resolved report }, '403': { description: System admin required }, '409': { description: Already resolved }, '422': { description: Invalid action for target } }
  /admin/dashboard:
    get:
      summary: Get operational counts for the system-admin dashboard
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses: { '200': { description: Dashboard counts }, '403': { description: System administrator required } }
  /admin/moderation/audit:
    get:
      summary: List moderation audit entries for system administrators
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { name: action, in: query, schema: { type: string } }
        - { name: target_type, in: query, schema: { type: string, enum: [user, business, post, comment, reel] } }
        - { name: report_id, in: query, schema: { type: integer, minimum: 1 } }
        - { name: actor_user_id, in: query, schema: { type: integer, minimum: 1 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses: { '200': { description: Paginated moderation audit }, '403': { description: System administrator required } }
  /admin/users:
    get:
      summary: List operational user records for system administrators
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, active, suspended, disabled] } }
        - { name: verified, in: query, schema: { type: boolean } }
        - { name: q, in: query, schema: { type: string, maxLength: 120 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses: { '200': { description: Paginated admin users }, '403': { description: System administrator required } }
  /admin/users/{user}:
    get:
      summary: Get a safe operational user detail
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ name: user, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses: { '200': { description: Admin user detail }, '403': { description: System administrator required }, '404': { description: User not found } }
  /admin/users/{user}/suspend:
    post:
      summary: Suspend a non-admin user with an audited reason
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ name: user, in: path, required: true, schema: { type: integer, format: int64 } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminSuspension' } } } }
      responses: { '200': { description: Suspended user }, '403': { description: System administrator required }, '422': { description: Invalid reason or protected system admin } }
  /admin/businesses:
    get:
      summary: List operational business records for system administrators
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, inactive, suspended] } }
        - { name: verified, in: query, schema: { type: boolean } }
        - { name: q, in: query, schema: { type: string, maxLength: 120 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses: { '200': { description: Paginated admin businesses }, '403': { description: System administrator required } }
  /admin/businesses/{business}:
    get:
      summary: Get a safe operational business detail
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ name: business, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses: { '200': { description: Admin business detail }, '403': { description: System administrator required }, '404': { description: Business not found } }
  /admin/businesses/{business}/suspend:
    post:
      summary: Suspend a business with an audited reason
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ name: business, in: path, required: true, schema: { type: integer, format: int64 } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminSuspension' } } } }
      responses: { '200': { description: Suspended business }, '403': { description: System administrator required }, '422': { description: Invalid reason } }
  /search:
    get:
      summary: Unified public user and business search
      parameters:
        - { name: q, in: query, required: false, schema: { type: string, minLength: 2, maxLength: 200 } }
        - { name: type, in: query, required: false, schema: { type: string, enum: [all, users, businesses], default: all } }
        - { name: industry, in: query, required: false, schema: { type: string } }
        - { name: emirate, in: query, required: false, schema: { type: string } }
        - { name: verified, in: query, required: false, schema: { type: boolean } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses: { '200': { description: Paginated normalized public search results }, '422': { description: Invalid search filters }, '429': { description: Rate limited } }
  /search/users:
    get:
      summary: Public professional profile search
      responses: { '200': { description: Paginated user search results }, '422': { description: Invalid search filters } }
  /search/businesses:
    get:
      summary: Public business search
      responses: { '200': { description: Paginated business search results }, '422': { description: Invalid search filters } }
  /notifications:
    get:
      summary: List the authenticated user's notifications
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { name: unread, in: query, schema: { type: boolean } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses: { '200': { description: Cursor-paginated notifications }, '401': { description: Unauthenticated } }
  /notifications/unread-count:
    get:
      summary: Count the authenticated user's unread notifications
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses: { '200': { description: Unread count } }
  /notifications/{notification}/read:
    patch:
      summary: Mark an owned notification as read
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ name: notification, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: Updated notification }, '404': { description: Notification not owned by the authenticated user } }
  /notifications/read-all:
    post:
      summary: Mark all notifications for the authenticated user as read
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses: { '200': { description: Updated count } }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: emirates-connect-session
      description: Laravel session cookie after GET /sanctum/csrf-cookie and credentialed SPA login.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
  schemas:
    ReportCreate:
      type: object
      required: [target_type, target_id, reason]
      properties:
        target_type: { type: string, enum: [user, business, post, comment, reel] }
        target_id: { type: integer, minimum: 1 }
        reason: { type: string, enum: [spam, harassment, hate_or_abuse, misinformation, impersonation, inappropriate_content, fraud_or_scam, privacy_violation, other] }
        details: { type: string, maxLength: 2000 }
    ReportModeration:
      type: object
      required: [action, resolution]
      properties:
        action: { type: string, enum: [dismiss, content_removed, account_suspended, business_suspended] }
        resolution: { type: string, maxLength: 2000 }
    AdminSuspension:
      type: object
      required: [reason]
      properties:
        reason: { type: string, maxLength: 2000 }
    AccountCredentials:
      type: object
      required: [name, email, password, password_confirmation]
      properties:
        name: { type: string, maxLength: 255, example: Sanu Khan }
        email: { type: string, format: email, maxLength: 255, example: sanu@example.com }
        password: { type: string, format: password, minLength: 8 }
        password_confirmation: { type: string, format: password }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    EmailRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    ResetPasswordRequest:
      allOf:
        - $ref: '#/components/schemas/EmailRequest'
        - type: object
          required: [token, password, password_confirmation]
          properties:
            token: { type: string }
            password: { type: string, format: password, minLength: 8 }
            password_confirmation: { type: string, format: password }
    MobileTokenRequest:
      type: object
      required: [email, password, device_name]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
        device_name: { type: string, maxLength: 100, example: Sanu's iPhone }
    SpaAuthResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [user]
          properties:
            user: { $ref: '#/components/schemas/User' }
    MobileAuthResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [user, token]
          properties:
            user: { $ref: '#/components/schemas/User' }
            token: { type: string }
    User:
      type: object
      required: [id, name, email, account_status]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        email: { type: string, format: email }
        email_verified_at: { type: string, format: date-time, nullable: true }
        account_status: { type: string, enum: [pending, active, suspended, disabled] }
        followers_count: { type: integer, minimum: 0 }
        following_count: { type: integer, minimum: 0 }
        is_following: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        profile: { $ref: '#/components/schemas/Profile' }
    Profile:
      type: object
      properties:
        display_name: { type: string, nullable: true }
        headline: { type: string, maxLength: 160, nullable: true }
        bio: { type: string, maxLength: 2000, nullable: true }
        job_title: { type: string, maxLength: 120, nullable: true }
        company_name: { type: string, nullable: true }
        industry: { type: string, nullable: true }
        emirate: { type: string, nullable: true }
        website_url: { type: string, format: uri, nullable: true }
        linkedin_url: { type: string, format: uri, nullable: true }
        avatar_url: { type: string, format: uri, nullable: true }
        cover_image_url: { type: string, format: uri, nullable: true }
        onboarding_completed: { type: boolean }
    ProfileUpdate:
      allOf:
        - $ref: '#/components/schemas/Profile'
    OnboardingRequest:
      allOf:
        - $ref: '#/components/schemas/ProfileUpdate'
      required: [display_name, headline, job_title, industry, emirate]
    AvatarUpload:
      type: object
      required: [avatar]
      properties:
        avatar: { type: string, format: binary, description: JPEG, PNG or WebP up to 5 MB }
    CoverUpload:
      type: object
      required: [cover_image]
      properties:
        cover_image: { type: string, format: binary, description: JPEG, PNG or WebP up to 8 MB }
    BusinessResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Business' }
    Business:
      type: object
      required: [id, name, slug, industry, emirate, status]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, maxLength: 150 }
        slug: { type: string }
        tagline: { type: string, nullable: true, maxLength: 180 }
        description: { type: string, nullable: true, maxLength: 5000 }
        industry: { type: string }
        emirate: { type: string }
        website_url: { type: string, format: uri, nullable: true }
        email: { type: string, format: email, nullable: true }
        phone: { type: string, nullable: true, maxLength: 30 }
        logo_url: { type: string, format: uri, nullable: true }
        cover_image_url: { type: string, format: uri, nullable: true }
        status: { type: string, enum: [active, inactive, suspended] }
        current_user_role: { type: string, enum: [owner, admin, editor], nullable: true }
        followers_count: { type: integer, minimum: 0 }
        is_following: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateBusinessRequest:
      type: object
      required: [name, industry, emirate]
      properties:
        name: { type: string, maxLength: 150 }
        tagline: { type: string, maxLength: 180, nullable: true }
        description: { type: string, maxLength: 5000, nullable: true }
        industry: { type: string }
        emirate: { type: string }
        website_url: { type: string, format: uri, nullable: true }
        email: { type: string, format: email, nullable: true }
        phone: { type: string, maxLength: 30, nullable: true }
    UpdateBusinessRequest:
      type: object
      properties:
        name: { type: string, maxLength: 150 }
        tagline: { type: string, maxLength: 180, nullable: true }
        description: { type: string, maxLength: 5000, nullable: true }
        industry: { type: string }
        emirate: { type: string }
        website_url: { type: string, format: uri, nullable: true }
        email: { type: string, format: email, nullable: true }
        phone: { type: string, maxLength: 30, nullable: true }
    AddBusinessMemberRequest:
      type: object
      required: [user_id, role]
      properties:
        user_id: { type: integer, format: int64 }
        role: { type: string, enum: [admin, editor] }
    UpdateBusinessMemberRequest:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [admin, editor] }
    BusinessLogoUpload:
      type: object
      required: [logo]
      properties:
        logo: { type: string, format: binary, description: JPEG, PNG or WebP up to 5 MB }
    BusinessCoverUpload:
      type: object
      required: [cover_image]
      properties:
        cover_image: { type: string, format: binary, description: JPEG, PNG or WebP up to 8 MB }
    FollowTarget:
      oneOf:
        - $ref: '#/components/schemas/FollowedUser'
        - $ref: '#/components/schemas/FollowedBusiness'
    FollowedUser:
      type: object
      required: [type, id, name]
      properties:
        type: { type: string, enum: [user] }
        id: { type: integer, format: int64 }
        name: { type: string }
        display_name: { type: string, nullable: true }
        headline: { type: string, nullable: true }
        avatar_url: { type: string, format: uri, nullable: true }
    FollowedBusiness:
      type: object
      required: [type, id, name, slug]
      properties:
        type: { type: string, enum: [business] }
        id: { type: integer, format: int64 }
        name: { type: string }
        slug: { type: string }
        logo_url: { type: string, format: uri, nullable: true }
    PostResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Post' }
    CursorPaginatedPosts:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Post' } }
        meta:
          type: object
          properties:
            per_page: { type: integer }
            next_cursor: { type: string, nullable: true }
            prev_cursor: { type: string, nullable: true }
    Post:
      type: object
      required: [id, status, author, media, reactions]
      properties:
        id: { type: integer, format: int64 }
        body: { type: string, nullable: true, maxLength: 5000 }
        status: { type: string, enum: [draft, published] }
        published_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        author: { $ref: '#/components/schemas/PostAuthor' }
        media: { type: array, maxItems: 4, items: { $ref: '#/components/schemas/PostMedia' } }
        reactions: { $ref: '#/components/schemas/ReactionSummary' }
    PostAuthor:
      oneOf:
        - $ref: '#/components/schemas/UserPostAuthor'
        - $ref: '#/components/schemas/BusinessPostAuthor'
    UserPostAuthor:
      type: object
      required: [type, id, name]
      properties:
        type: { type: string, enum: [user] }
        id: { type: integer, format: int64 }
        name: { type: string }
        display_name: { type: string, nullable: true }
        headline: { type: string, nullable: true }
        avatar_url: { type: string, format: uri, nullable: true }
    BusinessPostAuthor:
      type: object
      required: [type, id, name, slug]
      properties:
        type: { type: string, enum: [business] }
        id: { type: integer, format: int64 }
        name: { type: string }
        slug: { type: string }
        logo_url: { type: string, format: uri, nullable: true }
    PostMedia:
      type: object
      required: [id, type, url, mime_type, sort_order]
      properties:
        id: { type: integer, format: int64 }
        type: { type: string, enum: [image] }
        url: { type: string, format: uri }
        mime_type: { type: string, enum: [image/jpeg, image/png, image/webp] }
        width: { type: integer, nullable: true }
        height: { type: integer, nullable: true }
        sort_order: { type: integer }
    CreatePostRequest:
      type: object
      required: [author_type]
      properties:
        author_type: { type: string, enum: [user, business] }
        business_id: { type: integer, format: int64, nullable: true }
        body: { type: string, maxLength: 5000, nullable: true }
        status: { type: string, enum: [draft, published], default: published }
      description: For user authorship the server resolves the current user; business_id is required only for business authorship. Body or media is required.
    CreatePostMultipartRequest:
      allOf:
        - $ref: '#/components/schemas/CreatePostRequest'
      properties:
        media: { type: array, maxItems: 4, items: { type: string, format: binary, description: JPEG, PNG or WebP up to 8 MB } }
    UpdatePostRequest:
      type: object
      properties:
        body: { type: string, maxLength: 5000, nullable: true }
        status: { type: string, enum: [draft, published] }
      description: Author identity is immutable. A post must retain body or media.
    CreateReelRequest:
      type: object
      required: [author_type]
      properties:
        author_type: { type: string, enum: [user, business] }
        business_id: { type: integer, format: int64, nullable: true }
        caption: { type: string, maxLength: 2200, nullable: true }
      description: User authorship resolves to the authenticated user. Business authorship requires active owner/admin/editor membership.
    UpdateReelRequest:
      type: object
      properties:
        caption: { type: string, maxLength: 2200, nullable: true }
      description: Reel author, processing state and storage metadata are immutable.
    ReelVideoUpload:
      type: object
      required: [video]
      properties:
        video: { type: string, format: binary, description: One MP4 video up to 100 MB }
    ReelAuthor:
      oneOf:
        - type: object
          required: [type, id, display_name, is_verified]
          properties:
            type: { type: string, enum: [user] }
            id: { type: integer, format: int64 }
            display_name: { type: string }
            headline: { type: string, nullable: true }
            avatar_url: { type: string, format: uri, nullable: true }
            is_verified: { type: boolean }
        - type: object
          required: [type, id, name, slug, is_verified]
          properties:
            type: { type: string, enum: [business] }
            id: { type: integer, format: int64 }
            name: { type: string }
            slug: { type: string }
            logo_url: { type: string, format: uri, nullable: true }
            is_verified: { type: boolean }
    Reel:
      type: object
      required: [id, caption, status, author, playback_url, thumbnail_url, published_at, created_at]
      properties:
        id: { type: integer, format: int64 }
        caption: { type: string, nullable: true }
        status: { type: string, enum: [uploading, processing, published, failed] }
        author: { $ref: '#/components/schemas/ReelAuthor' }
        playback_url: { type: string, format: uri, nullable: true }
        thumbnail_url: { type: string, format: uri, nullable: true }
        duration_seconds: { type: integer, nullable: true }
        width: { type: integer, nullable: true }
        height: { type: integer, nullable: true }
        processing_error: { type: string, nullable: true, description: Generic creator-only failure message }
        published_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      description: Public resources expose playback metadata only; private source and storage paths are never returned.
    AddPostMediaRequest:
      type: object
      required: [media]
      properties:
        media: { type: string, format: binary, description: JPEG, PNG or WebP up to 8 MB; maximum four images per post }
    CommentResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Comment' }
    PaginatedComments:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Comment' } }
        meta: { type: object, description: Laravel pagination metadata }
    Comment:
      type: object
      required: [id, body, author, created_at, updated_at, replies_count, replies, reactions]
      properties:
        id: { type: integer, format: int64 }
        body: { type: string, maxLength: 2000 }
        author: { $ref: '#/components/schemas/PostAuthor' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        replies_count: { type: integer }
        replies: { type: array, items: { $ref: '#/components/schemas/CommentReply' } }
        reactions: { $ref: '#/components/schemas/ReactionSummary' }
      description: Replies are nested only one level; reply resources do not contain replies.
    CommentReply:
      type: object
      required: [id, body, author, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        body: { type: string, maxLength: 2000 }
        author: { $ref: '#/components/schemas/PostAuthor' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateCommentRequest:
      type: object
      required: [author_type, body]
      properties:
        author_type: { type: string, enum: [user, business] }
        business_id: { type: integer, format: int64, nullable: true }
        body: { type: string, maxLength: 2000 }
      description: User authorship is derived from the authenticated user. Business authorship requires active owner/admin/editor membership.
    UpdateCommentRequest:
      type: object
      required: [body]
      properties:
        body: { type: string, maxLength: 2000 }
      description: Comment author, post and parent are immutable.
    ReactionSummary:
      type: object
      required: [total, counts, current_user]
      properties:
        total: { type: integer, minimum: 0 }
        counts:
          type: object
          required: [like, celebrate, support, insightful]
          properties:
            like: { type: integer, minimum: 0 }
            celebrate: { type: integer, minimum: 0 }
            support: { type: integer, minimum: 0 }
            insightful: { type: integer, minimum: 0 }
        current_user: { type: string, enum: [like, celebrate, support, insightful], nullable: true }
      description: Aggregate counts and the authenticated human user's current reaction; guests receive null current_user.
    SetReactionRequest:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [like, celebrate, support, insightful] }
      description: Sets one idempotent human-user reaction per target. Businesses cannot be reaction actors.
    UserVerificationSubmission:
      type: object
      required: [legal_name, document_types, documents]
      properties:
        legal_name: { type: string, maxLength: 255 }
        document_types: { type: array, minItems: 1, maxItems: 5, items: { type: string, enum: [identity_document, proof_of_professional_identity, other_supporting_document] } }
        documents: { type: array, minItems: 1, maxItems: 5, items: { type: string, format: binary } }
      description: User subject is always the authenticated account. Documents are private.
    BusinessVerificationSubmission:
      type: object
      required: [legal_business_name, registration_number, document_types, documents]
      properties:
        legal_business_name: { type: string, maxLength: 255 }
        registration_number: { type: string, maxLength: 255 }
        licence_number: { type: string, maxLength: 255, nullable: true }
        issuing_authority: { type: string, maxLength: 255, nullable: true }
        document_types: { type: array, minItems: 1, maxItems: 5, items: { type: string, enum: [trade_licence, certificate_of_incorporation, proof_of_business, other_supporting_document] } }
        documents: { type: array, minItems: 1, maxItems: 5, items: { type: string, format: binary } }
      description: Requires current business owner/admin membership. Documents are private.
    RejectVerificationRequest:
      type: object
      required: [rejection_reason]
      properties:
        rejection_reason: { type: string, maxLength: 2000 }
    TemporaryDocumentAccess:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [url, expires_at]
          properties:
            url: { type: string, format: uri, description: Five-minute signed URL; never a permanent storage URL }
            expires_at: { type: string, format: date-time }
    SearchResult:
      type: object
      required: [type, id, is_verified]
      properties:
        type: { type: string, enum: [user, business] }
        id: { type: integer, format: int64 }
        display_name: { type: string, nullable: true }
        headline: { type: string, nullable: true }
        avatar_url: { type: string, format: uri, nullable: true }
        name: { type: string, nullable: true }
        slug: { type: string, nullable: true }
        description: { type: string, nullable: true }
        logo_url: { type: string, format: uri, nullable: true }
        industry: { type: string, nullable: true }
        emirate: { type: string, nullable: true }
        is_verified: { type: boolean }
      description: Public normalized result. Verification exposes only the trusted badge; no private verification state or fields.
    Notification:
      type: object
      required: [id, type, actor, subject, data, read_at, created_at]
      properties:
        id: { type: integer, format: int64 }
        type: { type: string, enum: [followed, post_commented, comment_replied, post_reacted, comment_reacted, verification_approved, verification_rejected] }
        actor: { nullable: true, oneOf: [{ $ref: '#/components/schemas/NotificationUserActor' }, { $ref: '#/components/schemas/NotificationBusinessActor' }] }
        subject: { nullable: true, type: object, properties: { type: { type: string }, id: { type: integer } } }
        data: { type: object, additionalProperties: true }
        read_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
      description: Recipient-scoped structured notification. No reviewer, document, recipient or storage fields are exposed.
    NotificationUserActor:
      type: object
      required: [type, id, display_name, is_verified]
      properties:
        type: { type: string, enum: [user] }
        id: { type: integer, format: int64 }
        display_name: { type: string, nullable: true }
        avatar_url: { type: string, format: uri, nullable: true }
        headline: { type: string, nullable: true }
        is_verified: { type: boolean }
    NotificationBusinessActor:
      type: object
      required: [type, id, name, slug, is_verified]
      properties:
        type: { type: string, enum: [business] }
        id: { type: integer, format: int64 }
        name: { type: string }
        slug: { type: string }
        logo_url: { type: string, format: uri, nullable: true }
        is_verified: { type: boolean }
